name: ALCHEMY Check
description: >-
  Run alchemy-orchestrate check_orchestration.py on a plan, preflight record,
  hand-off, or gate ledger, keep its JSON report, and fail the step unless the
  verdict is PASS or ACCEPT.
inputs:
  mode:
    description: plan, preflight, handoff, or gate.
    required: true
  plan:
    description: >-
      Path to the alchemy-plan/1 file, or with plan_field set, a JSON file whose
      field of that name holds the plan as an object or as JSON text. Relative
      paths resolve against the repository root.
    required: true
  record:
    description: >-
      preflight mode, the alchemy-preflight/1 file, checked with the repository
      root as --root, so the repository must still be at the plan base; handoff
      mode, an alchemy-handoff/1 file or a directory whose *.json files are each
      checked; gate mode, the alchemy-ledger/1 file. Ignored in plan mode.
    required: false
    default: ''
  profile:
    description: >-
      Project alchemy-workspace.json overriding the skill defaults. Empty uses
      alchemy-workspace.json at the repository root when it exists.
    required: false
    default: ''
  root:
    description: >-
      handoff mode, the workspace whose files the hand-off digests are checked
      against. Empty uses the repository root.
    required: false
    default: ''
  digests:
    description: >-
      handoff mode, "false" skips the digest checks against root and runs the
      structural checks only, for hand-offs checked after later waves have
      legitimately changed the files they relied on or changed.
    required: false
    default: 'true'
  integrated:
    description: >-
      Commit IDs the lead integrated a wave at, separated by commas or spaces.
      They are added to the checked copy of the plan's base.integrated, so a
      hand-off based on one of them is not stale. The input file is not changed.
    required: false
    default: ''
  preflight:
    description: >-
      gate mode, the alchemy-preflight/1 file, passed as --preflight when it
      exists. A gate on a plan with execution.unattended true fails
      (PREFLIGHT_REQUIRED) when the file is missing or no longer passes against
      the plan; an attended plan needs none.
    required: false
    default: ''
  run_plan:
    description: >-
      The run directory's plan.json. Its amendments and base.integrated are
      added to the checked copy of the plan; nothing else in it is read, so the
      approved part always comes from the plan input. Empty adds nothing.
    required: false
    default: ''
  approved:
    description: >-
      plan and gate modes, the approved revision's digest (the plan check's
      plan_digest before any amendment), passed as --approved: an amended plan
      whose approved part changed fails, and an extension of the rework bound
      counts only when this anchors it.
    required: false
    default: ''
  repository:
    description: >-
      gate mode, "true" passes the repository root as --root: the repository
      must be at the ledger head and clean outside the state directory, the
      integrated diff comes from git, and the rework bound is the one committed
      at the plan base.
    required: false
    default: 'false'
  plan_field:
    description: The field of the plan input that holds the plan; empty when the input is the plan.
    required: false
    default: ''
  publish:
    description: >-
      plan mode, "true" copies the checked plan to
      <state_dir>/<run id>/plan.json, creating <state_dir>/.gitignore with "*"
      when it is missing.
    required: false
    default: 'false'
  expect_base:
    description: plan mode, a commit the plan's base.commit must equal.
    required: false
    default: ''
  enforce:
    description: >-
      "true" fails the step on any verdict other than PASS or ACCEPT; "false"
      only reports it. Unreadable input fails the step either way.
    required: false
    default: 'true'
outputs:
  verdict:
    description: PASS, ACCEPT, FAIL, REJECT, STALE, RETRY, or ESCALATE.
  summary:
    description: One-line summary of the report; in gate mode, the gate block of alchemy-orchestrate section 6.
  report_file:
    description: The JSON report, kept under the step output directory.
  plan_file:
    description: The plan that was checked; in plan mode with publish, the published copy.
  base_commit:
    description: plan mode, the plan's base.commit.
  unattended:
    description: plan mode, "true" when the plan sets execution.unattended, otherwise "false".
  plan_digest:
    description: plan mode, the plan revision digest a preflight record binds to in its plan.digest.
  approved_digest:
    description: plan mode, the digest of the plan without its amendments, the approved revision.
  correction_passes:
    description: >-
      gate mode, the correction passes the rework bound still allows: the bound
      (the profile's, or an authorized extension's ceiling) minus the most
      cycles any origin chain has taken; 0 when none is left.
  run_dir:
    description: plan mode with publish, the run directory holding plan.json.
runs:
  using: python
  main: check.py
