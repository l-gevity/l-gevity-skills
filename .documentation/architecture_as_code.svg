<svg width="680" height="1160" viewBox="0 0 680 1160" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif">
<title>Architecture-as-code infographic</title>
<desc>Infographic explaining architecture-as-code for JavaScript: enforce dependency rules at build time. Shows a layered dependency diagram, four principles, the classic prefab, and five benefits.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="1160" fill="#FFFFFF"/>

<!-- ============ HERO ============ -->
<rect x="40" y="40" width="40" height="3" fill="#534AB7" rx="1.5"/>
<text x="40" y="74" font-size="22" font-weight="500" fill="#2C2C2A">Architecture-as-code</text>
<text x="40" y="100" font-size="14" fill="#5F5E5A">Declare which modules may import which. Violations fail the build.</text>
<text x="40" y="120" font-size="12" fill="#888780">Architecture rot is tangled imports nobody dares touch. Make the rules enforceable.</text>

<!-- ============ THE LAYER DIAGRAM ============ -->
<line x1="40" y1="148" x2="640" y2="148" stroke="#E5E4DC" stroke-width="0.5"/>
<text x="40" y="178" font-size="16" font-weight="500" fill="#2C2C2A">The classic prefab</text>

<!-- Layer: UI (top) -->
<rect x="220" y="210" width="240" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="236" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">UI</text>

<!-- Allowed arrows: UI → orders, UI → billing -->
<line x1="290" y1="254" x2="250" y2="284" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="390" y1="254" x2="430" y2="284" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Layer: Business (middle) — two independent modules -->
<rect x="130" y="290" width="160" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="210" y="316" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Orders</text>

<rect x="390" y="290" width="160" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="470" y="316" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Billing</text>

<!-- Forbidden arrow: Orders ✕ Billing (dashed red with X) -->
<line x1="290" y1="312" x2="390" y2="312" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
<text x="340" y="308" font-size="11" font-weight="500" fill="#E24B4A" text-anchor="middle">✕</text>

<!-- Allowed arrows: orders → storage, billing → storage -->
<line x1="210" y1="334" x2="290" y2="364" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="470" y1="334" x2="390" y2="364" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Layer: Storage (bottom) -->
<rect x="220" y="370" width="240" height="44" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="396" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">Storage</text>

<!-- Forbidden arrow: Storage ✕ upward (dashed red) -->
<line x1="340" y1="370" x2="340" y2="260" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
<text x="356" y="330" font-size="9" fill="#E24B4A" opacity="0.7">✕ no upward</text>

<!-- Forbidden arrow: UI ✕ Storage direct (dashed red, curved left) -->
<path d="M220 240 C130 240, 100 340, 220 390" fill="none" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
<text x="108" y="330" font-size="9" fill="#E24B4A" opacity="0.7">✕ no skip</text>

<!-- Legend -->
<line x1="490" y1="220" x2="520" y2="220" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="530" y="220" font-size="11" fill="#5F5E5A" dominant-baseline="central">Allowed</text>
<line x1="490" y1="240" x2="520" y2="240" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
<text x="530" y="240" font-size="11" fill="#5F5E5A" dominant-baseline="central">Forbidden</text>

<!-- Callout -->
<rect x="40" y="436" width="600" height="38" rx="8" fill="#F1EFE8"/>
<text x="60" y="455" font-size="13" fill="#5F5E5A" dominant-baseline="central">Allowed: <tspan font-weight="500" fill="#2C2C2A">UI → { Orders, Billing } → Storage</tspan>. No upward, lateral, or skip imports.</text>

<!-- ============ FOUR PRINCIPLES ============ -->
<line x1="40" y1="498" x2="640" y2="498" stroke="#E5E4DC" stroke-width="0.5"/>
<text x="40" y="528" font-size="16" font-weight="500" fill="#2C2C2A">Four principles</text>

<!-- Principle 1 -->
<rect x="40" y="548" width="290" height="110" rx="12" fill="#F8F7F2" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="578" font-size="14" font-weight="500" fill="#2C2C2A">Dependencies flow one way</text>
<text x="56" y="600" font-size="12" fill="#5F5E5A">Cycles couple modules. Changes</text>
<text x="56" y="616" font-size="12" fill="#5F5E5A">ripple unpredictably. One-way</text>
<text x="56" y="632" font-size="12" fill="#5F5E5A">flow keeps the graph acyclic.</text>

<!-- Principle 2 -->
<rect x="350" y="548" width="290" height="110" rx="12" fill="#F8F7F2" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="366" y="578" font-size="14" font-weight="500" fill="#2C2C2A">Stable things sit at the bottom</text>
<text x="366" y="600" font-size="12" fill="#5F5E5A">Volatile code depends on stable</text>
<text x="366" y="616" font-size="12" fill="#5F5E5A">code, never the reverse.</text>
<text x="366" y="632" font-size="12" fill="#5F5E5A">Change flows downward safely.</text>

<!-- Principle 3 -->
<rect x="40" y="668" width="290" height="110" rx="12" fill="#F8F7F2" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="698" font-size="14" font-weight="500" fill="#2C2C2A">Boundaries enable local reasoning</text>
<text x="56" y="720" font-size="12" fill="#5F5E5A">Constrained imports let you</text>
<text x="56" y="736" font-size="12" fill="#5F5E5A">change a module without holding</text>
<text x="56" y="752" font-size="12" fill="#5F5E5A">the whole system in your head.</text>

<!-- Principle 4 -->
<rect x="350" y="668" width="290" height="110" rx="12" fill="#F8F7F2" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="366" y="698" font-size="14" font-weight="500" fill="#2C2C2A">Fewer dependents = cheaper change</text>
<text x="366" y="720" font-size="12" fill="#5F5E5A">Encapsulation isn't aesthetic —</text>
<text x="366" y="736" font-size="12" fill="#5F5E5A">it's leverage. Each dependent is</text>
<text x="366" y="752" font-size="12" fill="#5F5E5A">a future cost on every change.</text>

<!-- ============ WHAT IT CATCHES ============ -->
<line x1="40" y1="803" x2="640" y2="803" stroke="#E5E4DC" stroke-width="0.5"/>
<text x="40" y="833" font-size="16" font-weight="500" fill="#2C2C2A">What it catches</text>

<!-- Legend -->
<rect x="40" y="852" width="12" height="12" fill="#F5C4B3" rx="2"/>
<text x="58" y="858" font-size="12" fill="#5F5E5A" dominant-baseline="central">Without</text>
<rect x="130" y="852" width="12" height="12" fill="#9FE1CB" rx="2"/>
<text x="148" y="858" font-size="12" fill="#5F5E5A" dominant-baseline="central">With architecture-as-code</text>

<!-- Catch row 1 -->
<text x="40" y="898" font-size="12" font-weight="500" fill="#888780" dominant-baseline="central">1</text>
<text x="68" y="898" font-size="13" fill="#2C2C2A" dominant-baseline="central">Layer skip (UI → Storage)</text>
<rect x="270" y="889" width="200" height="18" fill="#F5C4B3" rx="3"/>
<text x="530" y="898" font-size="12" fill="#5F5E5A" dominant-baseline="central">Days in review</text>
<line x1="40" y1="916" x2="640" y2="916" stroke="#F1EFE8" stroke-width="0.5"/>

<!-- Catch row 2 -->
<text x="40" y="934" font-size="12" font-weight="500" fill="#888780" dominant-baseline="central">2</text>
<text x="68" y="934" font-size="13" fill="#2C2C2A" dominant-baseline="central">Upward dependency</text>
<rect x="270" y="925" width="170" height="18" fill="#F5C4B3" rx="3"/>
<text x="530" y="934" font-size="12" fill="#5F5E5A" dominant-baseline="central">Hard to untangle</text>
<line x1="40" y1="952" x2="640" y2="952" stroke="#F1EFE8" stroke-width="0.5"/>

<!-- Catch row 3 -->
<text x="40" y="970" font-size="12" font-weight="500" fill="#888780" dominant-baseline="central">3</text>
<text x="68" y="970" font-size="13" fill="#2C2C2A" dominant-baseline="central">Sibling coupling</text>
<rect x="270" y="961" width="140" height="18" fill="#F5C4B3" rx="3"/>
<text x="530" y="970" font-size="12" fill="#5F5E5A" dominant-baseline="central">Hidden in code</text>
<line x1="40" y1="988" x2="640" y2="988" stroke="#F1EFE8" stroke-width="0.5"/>

<!-- Catch row 4 -->
<text x="40" y="1006" font-size="12" font-weight="500" fill="#888780" dominant-baseline="central">4</text>
<text x="68" y="1006" font-size="13" fill="#2C2C2A" dominant-baseline="central">Dependency cycle</text>
<rect x="270" y="997" width="110" height="18" fill="#F5C4B3" rx="3"/>
<text x="530" y="1006" font-size="12" fill="#5F5E5A" dominant-baseline="central">Ripple on change</text>
<line x1="40" y1="1024" x2="640" y2="1024" stroke="#F1EFE8" stroke-width="0.5"/>

<!-- Catch row 5 -->
<text x="40" y="1042" font-size="12" font-weight="500" fill="#888780" dominant-baseline="central">5</text>
<text x="68" y="1042" font-size="13" fill="#2C2C2A" dominant-baseline="central">Architectural drift</text>
<rect x="270" y="1033" width="250" height="18" fill="#F5C4B3" rx="3"/>
<text x="530" y="1042" font-size="12" fill="#5F5E5A" dominant-baseline="central">Invisible until crisis</text>

<!-- "With" overlay bars (short, teal — all caught at build time) -->
<rect x="270" y="889" width="10" height="18" fill="#1D9E75" rx="3"/>
<rect x="270" y="925" width="10" height="18" fill="#1D9E75" rx="3"/>
<rect x="270" y="961" width="10" height="18" fill="#1D9E75" rx="3"/>
<rect x="270" y="997" width="10" height="18" fill="#1D9E75" rx="3"/>
<rect x="270" y="1033" width="10" height="18" fill="#1D9E75" rx="3"/>

<!-- Callout -->
<rect x="40" y="1070" width="600" height="56" rx="8" fill="#F1EFE8"/>
<text x="60" y="1091" font-size="13" fill="#5F5E5A" dominant-baseline="central">With architecture-as-code, every violation becomes a <tspan font-weight="500" fill="#2C2C2A">build error</tspan> — the teal stub.</text>
<text x="60" y="1111" font-size="13" fill="#5F5E5A" dominant-baseline="central">Year five stays as clean as <tspan font-weight="500" fill="#2C2C2A">year one</tspan>.</text>

</svg>
