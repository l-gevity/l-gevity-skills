<svg width="1400" height="1100" viewBox="0 0 1400 1100" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif">
<title>L-GEVITY — The A.L.C.H.E.M.Y. Method</title>
<desc>The seven gates of A.L.C.H.E.M.Y. arranged as a heptagonal seal. Each vertex names one letter (A Architecture, L Locality, C Complexity, H Hermetic, E Enforcement, M Minimum, Y Yield), the gate it implements, and the question it forces. Center seal carries the A.L.C.H.E.M.Y. wordmark. Bottom strip shows execution order — M → A → L → C → E → H → Y — with a bounded L candidate → C measurement → L acceptance handshake for structural topology changes.</desc>

<defs>
  <radialGradient id="sealGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFF8E8"/>
    <stop offset="100%" stop-color="#F2E6C4"/>
  </radialGradient>
  <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#C19A4D"/>
    <stop offset="100%" stop-color="#8B6A1F"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
    <feOffset dx="0" dy="2" result="off"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect width="1400" height="1100" fill="#FBF9F2"/>

<!-- Subtle grid -->
<g opacity="0.35">
  <line x1="0" y1="240" x2="1400" y2="240" stroke="#EDE9DD" stroke-width="0.5"/>
  <line x1="0" y1="900" x2="1400" y2="900" stroke="#EDE9DD" stroke-width="0.5"/>
</g>

<!-- HEADER -->
<rect x="60" y="60" width="48" height="3" fill="#8B6A1F" rx="1.5"/>
<text x="60" y="106" font-size="34" font-weight="500" fill="#2C2C2A" letter-spacing="0.5">L-GEVITY · <tspan fill="#8B6A1F">A.L.C.H.E.M.Y.</tspan></text>
<text x="60" y="138" font-size="15" fill="#5F5E5A">Seven gates the AI agent walks · one orchestrator · one meta-loop.</text>

<!-- Top-right legend -->
<g transform="translate(1340, 80)" text-anchor="end">
  <text x="0" y="0" font-size="11" font-weight="500" fill="#888780" letter-spacing="2">SEAL OF THE SEVEN GATES</text>
  <text x="0" y="22" font-size="12" fill="#5F5E5A">Brand · A.L.C.H.E.M.Y. (clockwise from top)</text>
  <text x="0" y="40" font-size="12" fill="#5F5E5A">Execution order · M → A → L → C → E → H → Y</text>
</g>

<!-- =================== HEPTAGONAL SEAL =================== -->

<!-- Outer decorative ring -->
<circle cx="700" cy="560" r="395" fill="none" stroke="#C19A4D" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 6"/>

<!-- The heptagon: vertices at A L C H E M Y, clockwise from top -->
<polygon points="700,210 974,342 1041,638 852,875 548,875 359,638 426,342"
         fill="none" stroke="url(#goldLine)" stroke-width="1.5" opacity="0.6"/>

<!-- Connecting lines to inner seal -->
<g stroke="#C19A4D" stroke-width="0.6" opacity="0.35">
  <line x1="700" y1="210" x2="700" y2="410"/>
  <line x1="974" y1="342" x2="831" y2="475"/>
  <line x1="1041" y1="638" x2="847" y2="612"/>
  <line x1="852" y1="875" x2="785" y2="703"/>
  <line x1="548" y1="875" x2="615" y2="703"/>
  <line x1="359" y1="638" x2="553" y2="612"/>
  <line x1="426" y1="342" x2="569" y2="475"/>
</g>

<!-- INNER SEAL (smaller heptagon + wordmark) -->
<g transform="translate(700, 560)">
  <polygon points="0,-150 132,-72 145,72 65,135 -65,135 -145,72 -132,-72"
           fill="url(#sealGrad)" stroke="#C19A4D" stroke-width="1.5"/>
  <polygon points="0,-130 114,-63 126,63 56,117 -56,117 -126,63 -114,-63"
           fill="none" stroke="#C19A4D" stroke-width="0.6" opacity="0.5"/>

  <!-- Hermetic ouroboros hint -->
  <g opacity="0.18">
    <circle cx="0" cy="0" r="78" fill="none" stroke="#8B6A1F" stroke-width="1" stroke-dasharray="3 5"/>
  </g>

  <text x="0" y="-30" font-size="13" font-weight="500" fill="#8B6A1F" text-anchor="middle" letter-spacing="3">THE SEVEN GATES OF</text>
  <text x="0" y="14" font-size="44" font-weight="500" fill="#2C2C2A" text-anchor="middle" letter-spacing="3">A.L.C.H.E.M.Y.</text>
  <text x="0" y="50" font-size="12" font-style="italic" fill="#5F5E5A" text-anchor="middle">a discipline an agent walks ·</text>
  <text x="0" y="68" font-size="12" font-style="italic" fill="#5F5E5A" text-anchor="middle">before, during, and after the code</text>
</g>

<!-- =================== VERTEX CARDS =================== -->
<!-- Each card centered at its vertex. Card 200×110, half-w 100, half-h 55. -->
<!-- Letter big at top, gate word in the middle, question in italics at bottom. -->

<!-- A · Architecture · TOP (700, 210) -->
<g transform="translate(600, 155)" filter="url(#softShadow)">
  <rect width="200" height="110" rx="10" fill="#FFFFFF" stroke="#C19A4D" stroke-width="1.5"/>
  <rect x="0" y="0" width="200" height="4" rx="2" fill="#8B6A1F"/>
  <text x="20" y="40" font-size="36" font-weight="500" fill="#8B6A1F">A</text>
  <text x="62" y="38" font-size="15" font-weight="500" fill="#2C2C2A">Architecture</text>
  <text x="62" y="56" font-size="11" fill="#888780">First principles</text>
  <text x="20" y="82" font-size="11" font-style="italic" fill="#5F5E5A">"Is the design minimal,</text>
  <text x="20" y="98" font-size="11" font-style="italic" fill="#5F5E5A">modular, named for its purpose?"</text>
</g>

<!-- L · Locality · UPPER-RIGHT (974, 342) -->
<g transform="translate(874, 287)" filter="url(#softShadow)">
  <rect width="200" height="110" rx="10" fill="#FFFFFF" stroke="#C19A4D" stroke-width="1.5"/>
  <rect x="0" y="0" width="200" height="4" rx="2" fill="#8B6A1F"/>
  <text x="20" y="40" font-size="36" font-weight="500" fill="#8B6A1F">L</text>
  <text x="62" y="38" font-size="15" font-weight="500" fill="#2C2C2A">Locality</text>
  <text x="62" y="56" font-size="11" fill="#888780">Adaptive topology</text>
  <text x="20" y="82" font-size="11" font-style="italic" fill="#5F5E5A">"Where does it live? Which</text>
  <text x="20" y="98" font-size="11" font-style="italic" fill="#5F5E5A">neighbors may it import?"</text>
</g>

<!-- C · Complexity · RIGHT (1041, 638) -->
<g transform="translate(941, 583)" filter="url(#softShadow)">
  <rect width="200" height="110" rx="10" fill="#FFFFFF" stroke="#C19A4D" stroke-width="1.5"/>
  <rect x="0" y="0" width="200" height="4" rx="2" fill="#8B6A1F"/>
  <text x="20" y="40" font-size="36" font-weight="500" fill="#8B6A1F">C</text>
  <text x="62" y="38" font-size="15" font-weight="500" fill="#2C2C2A">Complexity</text>
  <text x="62" y="56" font-size="11" fill="#888780">Structural measurement</text>
  <text x="20" y="82" font-size="11" font-style="italic" fill="#5F5E5A">"Did this actually simplify,</text>
  <text x="20" y="98" font-size="11" font-style="italic" fill="#5F5E5A">on every axis?"</text>
</g>

<!-- H · Hermetic · LOWER-RIGHT (852, 875) -->
<g transform="translate(752, 820)" filter="url(#softShadow)">
  <rect width="200" height="110" rx="10" fill="#FFFFFF" stroke="#C19A4D" stroke-width="1.5"/>
  <rect x="0" y="0" width="200" height="4" rx="2" fill="#8B6A1F"/>
  <text x="20" y="40" font-size="36" font-weight="500" fill="#8B6A1F">H</text>
  <text x="62" y="38" font-size="15" font-weight="500" fill="#2C2C2A">Hermetic</text>
  <text x="62" y="56" font-size="11" fill="#888780">Shift-left sealing</text>
  <text x="20" y="82" font-size="11" font-style="italic" fill="#5F5E5A">"Is each defect sealed at the</text>
  <text x="20" y="98" font-size="11" font-style="italic" fill="#5F5E5A">earliest stage that catches it?"</text>
</g>

<!-- E · Enforcement · LOWER-LEFT (548, 875) -->
<g transform="translate(448, 820)" filter="url(#softShadow)">
  <rect width="200" height="110" rx="10" fill="#FFFFFF" stroke="#C19A4D" stroke-width="1.5"/>
  <rect x="0" y="0" width="200" height="4" rx="2" fill="#8B6A1F"/>
  <text x="20" y="40" font-size="36" font-weight="500" fill="#8B6A1F">E</text>
  <text x="62" y="38" font-size="15" font-weight="500" fill="#2C2C2A">Enforcement</text>
  <text x="62" y="56" font-size="11" fill="#888780">Architecture as code</text>
  <text x="20" y="82" font-size="11" font-style="italic" fill="#5F5E5A">"Are the rules encoded</text>
  <text x="20" y="98" font-size="11" font-style="italic" fill="#5F5E5A">as lint, not as prose?"</text>
</g>

<!-- M · Minimum · LEFT (359, 638) -->
<g transform="translate(259, 583)" filter="url(#softShadow)">
  <rect width="200" height="110" rx="10" fill="#FFFFFF" stroke="#C19A4D" stroke-width="1.5"/>
  <rect x="0" y="0" width="200" height="4" rx="2" fill="#8B6A1F"/>
  <text x="20" y="40" font-size="36" font-weight="500" fill="#8B6A1F">M</text>
  <text x="62" y="38" font-size="15" font-weight="500" fill="#2C2C2A">Minimum</text>
  <text x="62" y="56" font-size="11" fill="#888780">Necessity &amp; worth</text>
  <text x="20" y="82" font-size="11" font-style="italic" fill="#5F5E5A">"Does this address a real</text>
  <text x="20" y="98" font-size="11" font-style="italic" fill="#5F5E5A">problem worth its cost?"</text>
</g>

<!-- Y · Yield · UPPER-LEFT (426, 342) -->
<g transform="translate(326, 287)" filter="url(#softShadow)">
  <rect width="200" height="110" rx="10" fill="#FFFFFF" stroke="#C19A4D" stroke-width="1.5"/>
  <rect x="0" y="0" width="200" height="4" rx="2" fill="#8B6A1F"/>
  <text x="20" y="40" font-size="36" font-weight="500" fill="#8B6A1F">Y</text>
  <text x="62" y="38" font-size="15" font-weight="500" fill="#2C2C2A">Yield</text>
  <text x="62" y="56" font-size="11" fill="#888780">System optimization</text>
  <text x="20" y="82" font-size="11" font-style="italic" fill="#5F5E5A">"What is the constraint</text>
  <text x="20" y="98" font-size="11" font-style="italic" fill="#5F5E5A">that actually limits flow?"</text>
</g>

<!-- =================== EXECUTION ORDER STRIP =================== -->
<g transform="translate(700, 990)">
  <text x="0" y="-8" font-size="11" font-weight="500" fill="#888780" text-anchor="middle" letter-spacing="2.5">EXECUTION ORDER · ORCHESTRATED BY alchemy</text>

  <!-- Chevron-arrow flow: M → A → L → C → E → H → Y -->
  <g transform="translate(-385, 22)">
    <g>
      <rect x="0"   y="0" width="80" height="38" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/>
      <text x="40" y="25" font-size="18" font-weight="500" fill="#534AB7" text-anchor="middle">M</text>
    </g>
    <path d="M 84 19 L 110 19" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(118, 0)">
      <rect x="0"   y="0" width="80" height="38" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/>
      <text x="40" y="25" font-size="18" font-weight="500" fill="#534AB7" text-anchor="middle">A</text>
    </g>
    <path d="M 202 19 L 228 19" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(236, 0)">
      <rect x="0"   y="0" width="80" height="38" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/>
      <text x="40" y="25" font-size="18" font-weight="500" fill="#534AB7" text-anchor="middle">L</text>
    </g>
    <path d="M 320 19 L 346 19" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(354, 0)">
      <rect x="0"   y="0" width="80" height="38" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/>
      <text x="40" y="25" font-size="18" font-weight="500" fill="#534AB7" text-anchor="middle">C</text>
    </g>
    <path d="M 438 19 L 464 19" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(472, 0)">
      <rect x="0"   y="0" width="80" height="38" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/>
      <text x="40" y="25" font-size="18" font-weight="500" fill="#534AB7" text-anchor="middle">E</text>
    </g>
    <path d="M 556 19 L 582 19" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(590, 0)">
      <rect x="0"   y="0" width="80" height="38" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/>
      <text x="40" y="25" font-size="18" font-weight="500" fill="#534AB7" text-anchor="middle">H</text>
    </g>
    <path d="M 674 19 L 700 19" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(708, 0)">
      <rect x="0"   y="0" width="80" height="38" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/>
      <text x="40" y="25" font-size="18" font-weight="500" fill="#534AB7" text-anchor="middle">Y</text>
    </g>
  </g>

  <text x="0" y="82" font-size="11" font-style="italic" fill="#5F5E5A" text-anchor="middle">structural change: L candidate → C measurement → L acceptance · E waits · Y runs in iteration 2</text>
</g>

<!-- Footer corners -->
<g transform="translate(60, 1060)">
  <text x="0" y="0" font-size="11" font-weight="500" fill="#888780" letter-spacing="2.5">改善 · KAIZEN · continuous-improvement closes the loop</text>
</g>
<g transform="translate(1340, 1060)" text-anchor="end">
  <text x="0" y="0" font-size="11" font-weight="500" fill="#888780" letter-spacing="2.5">18 SKILLS · 7 GATES · 1 ORCHESTRATOR · 1 META-LOOP</text>
</g>

</svg>
