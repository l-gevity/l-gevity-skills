<svg width="1600" height="1000" viewBox="0 0 1600 1000" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif">
<title>AI-driven DevOps skill ecosystem — overview</title>
<desc>Landscape overview infographic showing ten architecture skills organized as a Kaizen-style continuous improvement loop around a central AI brain. Skills are grouped into four phases: Decide, Design, Enforce, Evolve.</desc>

<defs>
<!-- Gradient for the brain -->
<radialGradient id="brainGrad" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#7E76D8"/>
<stop offset="100%" stop-color="#534AB7"/>
</radialGradient>

<!-- Soft glow filter for emphasis -->
<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="6" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Warm cream background -->
<rect width="1600" height="1000" fill="#FBF9F2"/>

<!-- Subtle grid texture -->
<g opacity="0.4">
<line x1="0" y1="200" x2="1600" y2="200" stroke="#EDE9DD" stroke-width="0.5"/>
<line x1="0" y1="500" x2="1600" y2="500" stroke="#EDE9DD" stroke-width="0.5"/>
<line x1="0" y1="800" x2="1600" y2="800" stroke="#EDE9DD" stroke-width="0.5"/>
<line x1="400" y1="0" x2="400" y2="1000" stroke="#EDE9DD" stroke-width="0.5"/>
<line x1="800" y1="0" x2="800" y2="1000" stroke="#EDE9DD" stroke-width="0.5"/>
<line x1="1200" y1="0" x2="1200" y2="1000" stroke="#EDE9DD" stroke-width="0.5"/>
</g>

<!-- ========== HEADER ========== -->
<rect x="60" y="50" width="48" height="3" fill="#534AB7" rx="1.5"/>
<text x="60" y="92" font-size="32" font-weight="500" fill="#2C2C2A">Building software with AI</text>
<text x="60" y="124" font-size="16" fill="#5F5E5A">Ten skills, one continuous loop. The AI brain runs every gate; the team ships the result.</text>

<!-- Top-right legend -->
<g transform="translate(1120, 60)">
<text x="0" y="0" font-size="12" font-weight="500" fill="#5F5E5A" letter-spacing="1">PHASES</text>
<rect x="0" y="14" width="14" height="14" fill="#9FE1CB" rx="3"/>
<text x="22" y="25" font-size="12" fill="#2C2C2A">Decide</text>
<rect x="90" y="14" width="14" height="14" fill="#FAC775" rx="3"/>
<text x="112" y="25" font-size="12" fill="#2C2C2A">Design</text>
<rect x="180" y="14" width="14" height="14" fill="#CECBF6" rx="3"/>
<text x="202" y="25" font-size="12" fill="#2C2C2A">Enforce</text>
<rect x="280" y="14" width="14" height="14" fill="#F5C4B3" rx="3"/>
<text x="302" y="25" font-size="12" fill="#2C2C2A">Evolve</text>
</g>

<!-- ========== KAIZEN LOOP ARROWS (background, large, sweeping) ========== -->
<!-- A subtle quartet of curved arrows around the perimeter -->
<g opacity="0.18" stroke="#534AB7" stroke-width="2.5" fill="none" stroke-linecap="round">
<!-- Top arc: left-to-right across the top -->
<path d="M 280 380 Q 800 200 1320 380" marker-end="url(#arrowDark)"/>
<!-- Right arc: top-to-bottom -->
<path d="M 1380 430 Q 1480 600 1380 770" marker-end="url(#arrowDark)"/>
<!-- Bottom arc: right-to-left -->
<path d="M 1320 820 Q 800 1000 280 820" marker-end="url(#arrowDark)"/>
<!-- Left arc: bottom-to-top -->
<path d="M 220 770 Q 120 600 220 430" marker-end="url(#arrowDark)"/>
</g>

<!-- ========== CENTER: THE BRAIN ========== -->
<g transform="translate(800, 600)">
<!-- Soft outer halo -->
<circle cx="0" cy="0" r="135" fill="#534AB7" opacity="0.06"/>
<circle cx="0" cy="0" r="115" fill="#534AB7" opacity="0.10"/>

<!-- Brain core -->
<circle cx="0" cy="0" r="95" fill="url(#brainGrad)" filter="url(#softGlow)"/>

<!-- Brain texture: soft connecting nodes inside -->
<g opacity="0.45" stroke="#FFFFFF" stroke-width="1" fill="none">
<circle cx="-30" cy="-20" r="3" fill="#FFFFFF"/>
<circle cx="25" cy="-30" r="3" fill="#FFFFFF"/>
<circle cx="35" cy="20" r="3" fill="#FFFFFF"/>
<circle cx="-25" cy="30" r="3" fill="#FFFFFF"/>
<circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
<line x1="-30" y1="-20" x2="0" y2="0"/>
<line x1="25" y1="-30" x2="0" y2="0"/>
<line x1="35" y1="20" x2="0" y2="0"/>
<line x1="-25" y1="30" x2="0" y2="0"/>
<line x1="-30" y1="-20" x2="25" y2="-30"/>
<line x1="35" y1="20" x2="-25" y2="30"/>
</g>

<!-- Brain label -->
<text x="0" y="-12" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">AI brain</text>
<text x="0" y="14" font-size="12" fill="#E0DDF8" text-anchor="middle">runs every gate</text>
<text x="0" y="32" font-size="12" fill="#E0DDF8" text-anchor="middle">the team ships the result</text>
</g>

<!-- ========== ORBITING ROUTER: alchemy ========== -->
<!-- Sits just above the brain — it's the meta skill that sequences all others -->
<g transform="translate(800, 380)">
<rect x="-150" y="-42" width="300" height="84" rx="14" fill="#26215C" stroke="#534AB7" stroke-width="1"/>
<text x="0" y="-12" font-size="11" font-weight="500" fill="#CECBF6" text-anchor="middle" letter-spacing="1.5">META · ROUTER</text>
<text x="0" y="12" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Design &amp; refactor</text>
<text x="0" y="30" font-size="11" fill="#B5B0E6" text-anchor="middle">Sequences the seven gates</text>
</g>

<!-- Connector from router to brain -->
<line x1="800" y1="422" x2="800" y2="505" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

<!-- ========== ORBITING SKILL CARDS (8 around the brain) ========== -->
<!-- Layout strategy: 4 cards on the left side (Decide + Design upper), 4 on the right (Enforce + Evolve) -->
<!-- Plus continuous-improvement at bottom as the loop-closer -->

<!-- ===== LEFT SIDE: DECIDE phase (top-left and middle-left) ===== -->

<!-- Card 1: Functionality pruner (top-left, decide) -->
<g transform="translate(140, 250)">
<rect x="0" y="0" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="2"/>
<rect x="0" y="0" width="6" height="120" rx="3" fill="#1D9E75"/>
<text x="20" y="26" font-size="10" font-weight="500" fill="#1D9E75" letter-spacing="1.5">DECIDE · 01</text>
<text x="20" y="52" font-size="17" font-weight="500" fill="#2C2C2A">Functionality pruner</text>
<text x="20" y="76" font-size="12" fill="#5F5E5A">Necessity gate, then worth ledger.</text>
<text x="20" y="94" font-size="12" fill="#5F5E5A">YAGNI is the null hypothesis.</text>
<text x="20" y="112" font-size="11" font-style="italic" fill="#888780">"Does this need to exist?"</text>
</g>

<!-- Card 2: Architecture guidelines (middle-left, decide/design boundary) -->
<g transform="translate(80, 410)">
<rect x="0" y="0" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="2"/>
<rect x="0" y="0" width="6" height="120" rx="3" fill="#1D9E75"/>
<text x="20" y="26" font-size="10" font-weight="500" fill="#1D9E75" letter-spacing="1.5">DECIDE · 02</text>
<text x="20" y="52" font-size="17" font-weight="500" fill="#2C2C2A">Architecture guidelines</text>
<text x="20" y="76" font-size="12" fill="#5F5E5A">Seven sections of first-principles</text>
<text x="20" y="94" font-size="12" fill="#5F5E5A">rules. Yes/no, not vibes.</text>
<text x="20" y="112" font-size="11" font-style="italic" fill="#888780">"Is the design minimal?"</text>
</g>

<!-- ===== LEFT-LOWER: DESIGN phase ===== -->

<!-- Card 3: Morphogenetic architecture (lower-left) -->
<g transform="translate(80, 580)">
<rect x="0" y="0" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#FAC775" stroke-width="2"/>
<rect x="0" y="0" width="6" height="120" rx="3" fill="#EF9F27"/>
<text x="20" y="26" font-size="10" font-weight="500" fill="#854F0B" letter-spacing="1.5">DESIGN · 03</text>
<text x="20" y="52" font-size="17" font-weight="500" fill="#2C2C2A">Morphogenetic architecture</text>
<text x="20" y="76" font-size="12" fill="#5F5E5A">Declared placement + observed fields.</text>
<text x="20" y="94" font-size="12" fill="#5F5E5A">Keep or evolve boundaries.</text>
<text x="20" y="112" font-size="11" font-style="italic" fill="#888780">"Does reality match intent?"</text>
</g>

<!-- Card 4: Structural simplification (bottom-left) -->
<g transform="translate(140, 750)">
<rect x="0" y="0" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#FAC775" stroke-width="2"/>
<rect x="0" y="0" width="6" height="120" rx="3" fill="#EF9F27"/>
<text x="20" y="26" font-size="10" font-weight="500" fill="#854F0B" letter-spacing="1.5">DESIGN · 04</text>
<text x="20" y="52" font-size="17" font-weight="500" fill="#2C2C2A">Structural simplification</text>
<text x="20" y="76" font-size="12" fill="#5F5E5A">Complexity = (D, K, P, n) vector.</text>
<text x="20" y="94" font-size="12" fill="#5F5E5A">Score every axis separately.</text>
<text x="20" y="112" font-size="11" font-style="italic" fill="#888780">"Did we actually simplify?"</text>
</g>

<!-- ===== RIGHT SIDE: ENFORCE phase ===== -->

<!-- Card 5: Architecture as code (top-right) -->
<g transform="translate(1200, 250)">
<rect x="0" y="0" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#CECBF6" stroke-width="2"/>
<rect x="254" y="0" width="6" height="120" rx="3" fill="#534AB7"/>
<text x="240" y="26" font-size="10" font-weight="500" fill="#3C3489" letter-spacing="1.5" text-anchor="end">ENFORCE · 05</text>
<text x="240" y="52" font-size="17" font-weight="500" fill="#2C2C2A" text-anchor="end">Architecture as code</text>
<text x="240" y="76" font-size="12" fill="#5F5E5A" text-anchor="end">Eslint enforces import rules.</text>
<text x="240" y="94" font-size="12" fill="#5F5E5A" text-anchor="end">Drift becomes a build error.</text>
<text x="240" y="112" font-size="11" font-style="italic" fill="#888780" text-anchor="end">"Is the rule enforceable?"</text>
</g>

<!-- Card 6: Defect shift-left (middle-right) -->
<g transform="translate(1260, 410)">
<rect x="0" y="0" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#CECBF6" stroke-width="2"/>
<rect x="254" y="0" width="6" height="120" rx="3" fill="#534AB7"/>
<text x="240" y="26" font-size="10" font-weight="500" fill="#3C3489" letter-spacing="1.5" text-anchor="end">ENFORCE · 06</text>
<text x="240" y="52" font-size="17" font-weight="500" fill="#2C2C2A" text-anchor="end">Defect shift-left</text>
<text x="240" y="76" font-size="12" fill="#5F5E5A" text-anchor="end">Catch defects at the earliest</text>
<text x="240" y="94" font-size="12" fill="#5F5E5A" text-anchor="end">stage they technically can run.</text>
<text x="240" y="112" font-size="11" font-style="italic" fill="#888780" text-anchor="end">"Could we catch this sooner?"</text>
</g>

<!-- ===== RIGHT-LOWER: EVOLVE phase ===== -->

<!-- Card 7: CI/CD reliability (lower-right) -->
<g transform="translate(1260, 580)">
<rect x="0" y="0" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="2"/>
<rect x="254" y="0" width="6" height="120" rx="3" fill="#D85A30"/>
<text x="240" y="26" font-size="10" font-weight="500" fill="#993C1D" letter-spacing="1.5" text-anchor="end">EVOLVE · 07</text>
<text x="240" y="52" font-size="17" font-weight="500" fill="#2C2C2A" text-anchor="end">CI/CD reliability</text>
<text x="240" y="76" font-size="12" fill="#5F5E5A" text-anchor="end">Idempotent, immutable artifacts,</text>
<text x="240" y="94" font-size="12" fill="#5F5E5A" text-anchor="end">zero-knowledge cloud auth.</text>
<text x="240" y="112" font-size="11" font-style="italic" fill="#888780" text-anchor="end">"Is the pipeline safe to retry?"</text>
</g>

<!-- Card 8: System optimization (bottom-right) -->
<g transform="translate(1200, 750)">
<rect x="0" y="0" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="2"/>
<rect x="254" y="0" width="6" height="120" rx="3" fill="#D85A30"/>
<text x="240" y="26" font-size="10" font-weight="500" fill="#993C1D" letter-spacing="1.5" text-anchor="end">EVOLVE · 08</text>
<text x="240" y="52" font-size="17" font-weight="500" fill="#2C2C2A" text-anchor="end">System optimization</text>
<text x="240" y="76" font-size="12" fill="#5F5E5A" text-anchor="end">Question · delete · simplify ·</text>
<text x="240" y="94" font-size="12" fill="#5F5E5A" text-anchor="end">speed up · automate. In order.</text>
<text x="240" y="112" font-size="11" font-style="italic" fill="#888780" text-anchor="end">"What's the constraint?"</text>
</g>

<!-- ========== KAIZEN LOOP-CLOSER: continuous improvement (bottom center) ========== -->
<g transform="translate(800, 870)">
<rect x="-200" y="-40" width="400" height="80" rx="40" fill="#FFFFFF" stroke="#534AB7" stroke-width="2"/>
<text x="-160" y="-12" font-size="11" font-weight="500" fill="#534AB7" letter-spacing="1.5">META · LOOP</text>
<text x="-160" y="12" font-size="17" font-weight="500" fill="#2C2C2A">Continuous improvement</text>
<text x="-160" y="30" font-size="12" fill="#5F5E5A">Each correction → root cause → structural fix</text>

<!-- Cycle icon on the right -->
<g transform="translate(140, 0)" stroke="#534AB7" stroke-width="2" fill="none">
<path d="M -22 -2 A 22 22 0 1 1 -2 22" stroke-linecap="round"/>
<path d="M -2 22 L -8 16 M -2 22 L 4 18" stroke-linecap="round"/>
<text x="0" y="4" font-size="14" font-weight="500" fill="#534AB7" text-anchor="middle" stroke="none">↻</text>
</g>
</g>

<!-- ========== CONNECTING LINES from cards to brain ========== -->
<g stroke="#B4B2A9" stroke-width="1" fill="none" opacity="0.45">
<line x1="400" y1="310" x2="710" y2="580"/>
<line x1="340" y1="470" x2="708" y2="595"/>
<line x1="340" y1="640" x2="708" y2="615"/>
<line x1="400" y1="810" x2="710" y2="630"/>
<line x1="1200" y1="310" x2="890" y2="580"/>
<line x1="1260" y1="470" x2="892" y2="595"/>
<line x1="1260" y1="640" x2="892" y2="615"/>
<line x1="1200" y1="810" x2="890" y2="630"/>
<!-- Continuous improvement to brain -->
<line x1="800" y1="830" x2="800" y2="700"/>
</g>

<!-- ========== KAIZEN LABEL (subtle, at bottom-left) ========== -->
<g transform="translate(60, 940)">
<text x="0" y="0" font-size="11" font-weight="500" fill="#888780" letter-spacing="2">改善 · KAIZEN</text>
<text x="0" y="18" font-size="12" fill="#5F5E5A">Small, deliberate, compounding improvements — every loop, every PR, every defect.</text>
</g>

<!-- ========== TOP-RIGHT: Quick metrics / philosophy ========== -->
<g transform="translate(1450, 940)">
<text x="0" y="0" font-size="11" font-weight="500" fill="#888780" letter-spacing="2" text-anchor="end">10 SKILLS</text>
<text x="0" y="18" font-size="12" fill="#5F5E5A" text-anchor="end">2 routers · 4 phases · 1 loop</text>
</g>

</svg>
