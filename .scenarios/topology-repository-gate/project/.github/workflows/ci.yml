name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Requirement record schema
        run: npx --yes ajv-cli@5.0.0 validate -s requirements/records.schema.json -d requirements/records.yaml
